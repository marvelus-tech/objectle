name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Do not skip: a stale Worker makes /api/room/* 404 while Pages looks fine.
      - name: Require Cloudflare credentials for Worker deploy
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set as repository secrets."
            echo "Without them, objectle-worker-demo stays on old code and room/tool URLs 404."
            echo "Create a token with Workers Scripts Edit + D1 Edit, then re-run this workflow."
            exit 1
          fi

      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Smoke-test room API
        run: |
          set -euo pipefail
          base="https://objectle-worker-demo.marvelus.workers.dev"
          code="CI$(date +%s | tail -c 5)"
          # Too-short codes should 400; proves /api/room exists (old Worker returned 404).
          status=$(curl -sS -o /tmp/room-body.txt -w "%{http_code}" "$base/api/room/AB")
          if [ "$status" = "404" ]; then
            echo "::error::Room route still 404 after deploy. Live Worker is stale or wrong script."
            cat /tmp/room-body.txt
            exit 1
          fi
          if [ "$status" != "400" ]; then
            echo "::warning::Expected 400 for short room code, got $status"
          fi
          manual=$(curl -sS -f "$base/api/room/$code")
          echo "$manual" | head -n 5
          echo "$manual" | grep -q "OBJECTLE ROOM" || {
            echo "::error::Room manual missing expected header"
            exit 1
          }
          curl -sS -f "$base/api/room/$code/tools/read_view" | head -n 3
          curl -sS -f "$base/api/health" | grep -q '"rooms":true'

  build:
    runs-on: ubuntu-latest
    needs: deploy-worker
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for GitHub Pages
        run: npm run build
        env:
          NODE_ENV: production
          VITE_BASE_PATH: /objectle/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
